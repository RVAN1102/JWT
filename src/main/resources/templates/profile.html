<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }
        .profile-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-top: 2rem;
        }
        .avatar-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e2e8f0;
        }
        .btn-outline-danger {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg px-4">
        <div class="container-fluid">
            <span class="navbar-brand fw-semibold text-dark">Portal</span>
            <div class="d-flex">
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Sign Out</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="profile-card text-center">
                    <img id="userAvatar" src="" alt="Avatar" class="avatar-img mb-3">
                    <h3 id="userFullName" class="fw-semibold mb-1"></h3>
                    <p id="userEmail" class="text-muted mb-4"></p>
                    <div class="text-start border-top pt-3">
                        <div class="mb-2">
                            <span class="text-secondary small">User ID:</span>
                            <span id="userId" class="fw-medium ms-1"></span>
                        </div>
                        <div class="mb-2">
                            <span class="text-secondary small">Status:</span>
                            <span class="badge bg-success ms-1">Active</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/js/mainjs.js"></script>
</body>
</html>
